name: Build EndlessMutationCailee
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Install Gradle 2.7 (compatível com ForgeGradle 2.1)
        shell: bash
        run: |
          set -e
          curl -L --fail --retry 3 https://services.gradle.org/distributions/gradle-2.7-bin.zip -o /tmp/gradle-2.7-bin.zip
          unzip -q /tmp/gradle-2.7-bin.zip -d /tmp
          /tmp/gradle-2.7/bin/gradle --version
      - name: Build mod
        run: /tmp/gradle-2.7/bin/gradle --no-daemon clean build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EndlessMutationCailee-1.8.9
          path: build/libs/*.jar
          if-no-files-found: error
